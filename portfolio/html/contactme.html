<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <form method="post">
        <fieldset>
            

            <table>
                <legend>Contact Me: </legend>
                <tr>
                    <td><label for="name">First Name:</label></td>
                    <td><label for="name">Last Name:</label></td>
                </tr>
                <tr>
                    <td><label>Gender:</label></td>
                    <td>
                        <input type="radio" name="gender" value="male">Male
                        <input type="radio" name="gender" value="female">female
                    </td>
                </tr>
                <tr>
                    <td><label for="email">Email:</label></td>
                    <td><input type="password" id="pass" name="pass" required></td>
                </tr>
                <legend>Services: </legend>
                <tr>
                    <td><label for="name">Web Development:</label></td>
                    
                </tr>
                <tr>
                    
                    <td>
                        <input type="checkbox" name="al" value="al">al
                        <input type="checkbox" name="ml" value="ml">ml
                    </td>
                </tr>
                <tr>
                    <td><label for="name">Backend</label></td>
                    
                </tr>
                
                <tr>
                 <td><label for="Reason of contact:">Reason of contact: </label></td>
                 <select id="Reason of contact:" name="Reason of contact:">
                    <option>Job</option>
                    <option>Projects</option>
                    <option>Thesis</option>
                 </select>   
                </tr>
                <tr>
                    <td><label>Book Slot: </label>
                    <input type="date" name="date" value="date">date
                </td>
                </tr>
                <tr>
                    <td>
                    <input type="button" name="submit" value="submit">submit
                    <input type="button" name="reset" value="reset">reset
                </td>
                </tr>
                
            </table>
        </fieldset>
    </form>
</body>
</html>
